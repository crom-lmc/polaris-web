<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>人力中心</title>
    <script>
      (function () {
        try {
          // 跨应用共享主题：URL 参数（iframe 嵌入）> 共享 cookie > 本应用 localStorage
          var q = new URLSearchParams(location.search).get('theme');
          var ck = document.cookie.match(/(?:^|; )polaris_theme=(light|dark)/);
          var t =
            q === 'light' || q === 'dark'
              ? q
              : ck
                ? ck[1]
                : localStorage.getItem('ehr_theme');
          if (t !== 'light' && t !== 'dark') {
            t =
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
