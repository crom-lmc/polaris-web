<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Polaris Forum，分享技术经验与生活灵感。" />
    <title>Polaris Forum · 技术社区</title>
    <script>
      (function () {
        try {
          var ck = document.cookie.match(/(?:^|; )polaris_theme=(light|dark)/);
          var t = ck ? ck[1] : localStorage.getItem('forum_theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
